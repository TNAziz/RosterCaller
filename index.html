<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Roster Caller">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Roster Caller</title>
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --text: #16181d; --muted: #6b7280; --line: #e4e6ea;
  --accent: #cc0000; --accent-text: #fff;
  --ok: #15803d; --ok-bg: #dcfce7; --warn: #b45309; --warn-bg: #fef3c7; --abs: #6b7280; --abs-bg: #eceef1;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111214; --card: #1c1d21; --text: #f2f3f5; --muted: #9aa0aa; --line: #2c2e34;
    --accent: #ef4444; --ok: #4ade80; --ok-bg: #14351f; --warn: #fbbf24; --warn-bg: #3a2c0b; --abs: #a1a1aa; --abs-bg: #2a2b30;
    --shadow: none;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  display: flex; flex-direction: column; overscroll-behavior-y: none;
}
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
header {
  padding: calc(env(safe-area-inset-top) + 8px) 16px 8px;
  display: flex; align-items: center; gap: 8px; background: var(--bg);
}
header select {
  flex: 1; min-width: 0; font-size: 20px; font-weight: 700; border: 0; background: transparent;
  padding: 6px 0; appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: right 6px center, right 0 center; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 20px;
}
.icon-btn { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:active { background: var(--line); }
main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px 24px; }
.view { display: none; max-width: 560px; margin: 0 auto; }
.view.active { display: block; }
nav {
  display: flex; border-top: 1px solid var(--line); background: var(--card);
  padding-bottom: env(safe-area-inset-bottom);
}
nav button { flex: 1; padding: 8px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
nav button.active { color: var(--accent); }
nav svg { width: 26px; height: 26px; }

/* Call view */
.status { color: var(--muted); font-size: 14px; text-align: center; margin: 4px 0 12px; }
.stage {
  background: var(--card); border-radius: 24px; box-shadow: var(--shadow); padding: 16px;
  display: flex; flex-direction: column; align-items: center; text-align: center;
}
.stage .photo { width: min(62vw, 34vh, 300px); aspect-ratio: 1; border-radius: 20px; object-fit: cover; background: var(--abs-bg); display: grid; place-items: center; font-size: 72px; font-weight: 700; color: var(--muted); overflow: hidden; }
.stage .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.stage .name { font-size: 28px; font-weight: 800; margin: 12px 0 2px; line-height: 1.15; word-break: break-word; }
.stage .sub { color: var(--muted); font-size: 14px; min-height: 20px; }
.stage.spinning .photo, .stage.spinning .name { opacity: .55; }
.results { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 14px; }
.results button { padding: 14px 4px; border-radius: 14px; font-weight: 700; font-size: 15px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.results .r-ok { background: var(--ok-bg); color: var(--ok); }
.results .r-no { background: var(--warn-bg); color: var(--warn); }
.results .r-abs { background: var(--abs-bg); color: var(--abs); }
.results span { font-size: 22px; line-height: 1; }
.primary { width: 100%; margin-top: 14px; padding: 18px; border-radius: 16px; background: var(--accent); color: var(--accent-text); font-size: 19px; font-weight: 700; }
.primary:active, .results button:active { transform: scale(.98); }
.primary:disabled { opacity: .4; }
.row-actions { display: flex; justify-content: space-between; margin-top: 10px; }
.link { color: var(--accent); font-weight: 600; padding: 8px 4px; }
.link:disabled { color: var(--muted); opacity: .5; }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 60px); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; white-space: nowrap; }
.toast.show { opacity: .92; }

/* Lists */
.toolbar { display: flex; gap: 8px; margin: 4px 0 12px; flex-wrap: wrap; }
.chip-btn { padding: 9px 14px; border-radius: 20px; background: var(--card); box-shadow: var(--shadow); font-weight: 600; font-size: 14px; border: 1px solid var(--line); }
.chip-btn.accent { background: var(--accent); color: var(--accent-text); border-color: transparent; }
.list { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.thumb { padding: 0; width: 46px; height: 46px; border-radius: 12px; flex: none; background: var(--abs-bg); display: grid; place-items: center; font-weight: 700; color: var(--muted); overflow: hidden; position: relative; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.item .main { flex: 1; min-width: 0; padding: 0; }
.item .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .meta { font-size: 13px; color: var(--muted); }
.item.absent .title, .item.absent .thumb { opacity: .45; }
.pill { font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 14px; flex: none; }
.pill.present { background: var(--ok-bg); color: var(--ok); }
.pill.absent { background: var(--abs-bg); color: var(--abs); }
.tag { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 10px; }
.tag.answered { background: var(--ok-bg); color: var(--ok); }
.tag.no_answer { background: var(--warn-bg); color: var(--warn); }
.tag.absent { background: var(--abs-bg); color: var(--abs); }
.x { color: var(--muted); font-size: 22px; width: 32px; height: 32px; border-radius: 16px; }
.section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 20px 4px 8px; font-weight: 600; }
.empty { text-align: center; color: var(--muted); padding: 48px 16px; }
.empty h2 { color: var(--text); margin: 0 0 8px; font-size: 20px; }
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.summary div { background: var(--card); border-radius: 14px; padding: 10px; text-align: center; box-shadow: var(--shadow); }
.summary b { display: block; font-size: 22px; }
.summary small { color: var(--muted); }

/* Dialogs */
dialog { border: 0; padding: 0; border-radius: 20px; background: var(--card); color: var(--text); width: min(92vw, 460px); max-height: 85vh; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
dialog::backdrop { background: rgba(0,0,0,.4); }
.dlg { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.dlg h3 { margin: 0; font-size: 20px; }
.dlg p { margin: 0; color: var(--muted); font-size: 14px; }
.dlg input[type=text], .dlg textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; }
.dlg textarea { min-height: 160px; resize: vertical; }
.dlg .btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.btn { padding: 11px 16px; border-radius: 12px; background: var(--abs-bg); font-weight: 600; }
.btn.accent { background: var(--accent); color: var(--accent-text); }
.btn.danger { color: #dc2626; }
.big-photo { padding: 0; width: 140px; height: 140px; border-radius: 18px; margin: 0 auto; background: var(--abs-bg); display: grid; place-items: center; font-size: 48px; font-weight: 700; color: var(--muted); overflow: hidden; }
.big-photo img { width: 100%; height: 100%; object-fit: cover; }
.stats-line { text-align: center; font-size: 14px; color: var(--muted); }
.menu-list { display: flex; flex-direction: column; }
.menu-list button { text-align: left; padding: 14px 4px; border-bottom: 1px solid var(--line); font-weight: 600; }
.menu-list button:last-child { border-bottom: 0; }
.menu-list button small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.toggle small { display: block; color: var(--muted); font-size: 13px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.hidden { display: none !important; }
.install-tip { background: var(--warn-bg); color: var(--text); border-radius: 14px; padding: 12px 14px; font-size: 14px; margin-bottom: 12px; }
</style>
</head>
<body>
<header>
  <select id="classSelect" aria-label="Class"></select>
  <button class="icon-btn" id="settingsBtn" aria-label="Settings">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<main>
  <section class="view active" id="view-call"></section>
  <section class="view" id="view-roster"></section>
  <section class="view" id="view-history"></section>
</main>

<nav>
  <button data-view="call" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
    Call
  </button>
  <button data-view="roster">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    Roster
  </button>
  <button data-view="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    History
  </button>
</nav>

<div class="toast" id="toast"></div>
<dialog id="dlg"></dialog>
<input type="file" id="filePick" class="hidden">

<script>
'use strict';

/* ---------- Storage (IndexedDB, everything stays on this device) ---------- */
const DB_NAME = 'rostercaller';
let db;
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      d.createObjectStore('classes', { keyPath: 'id' });
      d.createObjectStore('students', { keyPath: 'id' });
      d.createObjectStore('events', { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function tx(store, mode, fn) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(store, mode);
    const s = t.objectStore(store);
    let result;
    const r = fn(s);
    if (r) r.onsuccess = () => { result = r.result; };
    t.oncomplete = () => resolve(result);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error);
  });
}
const getAll = store => tx(store, 'readonly', s => s.getAll());
const put = (store, obj) => tx(store, 'readwrite', s => s.put(obj));
const del = (store, id) => tx(store, 'readwrite', s => s.delete(id));
function delMany(store, ids) {
  return tx(store, 'readwrite', s => { ids.forEach(id => s.delete(id)); });
}
function putMany(store, objs) {
  return tx(store, 'readwrite', s => { objs.forEach(o => s.put(o)); });
}

/* ---------- State ---------- */
const state = {
  classes: [], students: [], events: [],
  classId: null, view: 'call',
  current: null,      // student currently shown on Call screen
  marked: false,      // whether current pick has been marked
  lastEventId: null,  // for undo
  historyDate: null,
  spinning: false,
};
const prefs = Object.assign({ fair: true, animate: true }, loadPref('prefs') || {});
function loadPref(k) { try { return JSON.parse(localStorage.getItem('rc.' + k)); } catch { return null; } }
function savePref(k, v) { try { localStorage.setItem('rc.' + k, JSON.stringify(v)); } catch {} }

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const today = () => dateKey(new Date());
function dateKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const initials = name => name.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase() || '?';
const $ = sel => document.querySelector(sel);

const classStudents = () => state.students.filter(s => s.classId === state.classId).sort((a, b) => a.name.localeCompare(b.name));
const classEvents = () => state.events.filter(e => e.classId === state.classId);
const isAbsent = (sid, date = today()) => state.events.some(e => e.studentId === sid && e.date === date && e.type === 'absent');
const callsToday = sid => state.events.filter(e => e.studentId === sid && e.date === today() && (e.type === 'answered' || e.type === 'no_answer')).length;
function studentStats(sid) {
  const ev = state.events.filter(e => e.studentId === sid);
  const answered = ev.filter(e => e.type === 'answered').length;
  const noAnswer = ev.filter(e => e.type === 'no_answer').length;
  const absent = ev.filter(e => e.type === 'absent').length;
  return { answered, noAnswer, absent, called: answered + noAnswer };
}

function photoHTML(s, cls = '') {
  return s && s.photo ? `<img src="${s.photo}" alt="" class="${cls}">` : esc(initials(s ? s.name : '?'));
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------- Header / class select ---------- */
function renderClassSelect() {
  const sel = $('#classSelect');
  const opts = state.classes.slice().sort((a, b) => a.name.localeCompare(b.name))
    .map(c => `<option value="${c.id}" ${c.id === state.classId ? 'selected' : ''}>${esc(c.name)}</option>`);
  if (!state.classes.length) opts.push('<option value="" selected>No class yet</option>');
  opts.push('<option value="__new">+ New class…</option>');
  sel.innerHTML = opts.join('');
}
$('#classSelect').addEventListener('change', e => {
  const v = e.target.value;
  if (v === '__new') { renderClassSelect(); newClassDialog(); return; }
  selectClass(v);
});
function selectClass(id) {
  state.classId = id; state.current = null; state.marked = false; state.lastEventId = null; state.historyDate = null;
  savePref('classId', id);
  renderAll();
}

/* ---------- Navigation ---------- */
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  state.view = b.dataset.view;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + state.view));
  render();
  $('main').scrollTop = 0;
}));

function renderAll() { renderClassSelect(); render(); }
function render() {
  if (state.view === 'call') renderCall();
  if (state.view === 'roster') renderRoster();
  if (state.view === 'history') renderHistory();
}

function noClassHTML() {
  return `<div class="empty"><h2>Welcome to Roster Caller</h2><p>Create a class to get started. Everything you add stays on this phone.</p>
    <button class="primary" onclick="newClassDialog()">Create a class</button></div>`;
}

/* ---------- Call view ---------- */
function renderCall() {
  const el = $('#view-call');
  if (!state.classId) { el.innerHTML = noClassHTML(); return; }
  const roster = classStudents();
  if (!roster.length) {
    el.innerHTML = `<div class="empty"><h2>No students yet</h2><p>Add your students (with photos) on the Roster tab.</p>
      <button class="primary" onclick="goRoster()">Go to Roster</button></div>`;
    return;
  }
  const absent = roster.filter(s => isAbsent(s.id)).length;
  const present = roster.length - absent;
  const called = roster.filter(s => callsToday(s.id) > 0).length;
  const cur = state.current;
  let tip = '';
  if (!isStandalone() && !loadPref('tipDismissed') && /iPhone|iPad/.test(navigator.userAgent)) {
    tip = `<div class="install-tip"><b>Tip:</b> tap Share → <b>Add to Home Screen</b> so this works like an app and your roster is kept safely.
      <button class="link" onclick="savePref('tipDismissed',true);renderCall()">Dismiss</button></div>`;
  }
  el.innerHTML = `${tip}
    <div class="status">${present} present · ${absent} absent · ${called} of ${present} called today</div>
    <div class="stage" id="stage">
      <div class="photo" id="stagePhoto">${cur ? photoHTML(cur) : '?'}</div>
      <div class="name" id="stageName">${cur ? esc(cur.name) : 'Ready'}</div>
      <div class="sub" id="stageSub">${cur ? subLine(cur) : 'Tap below to pick a student at random'}</div>
    </div>
    <div class="results ${cur && !state.marked ? '' : 'hidden'}" id="results">
      <button class="r-ok" onclick="mark('answered')"><span>✓</span>Answered</button>
      <button class="r-no" onclick="mark('no_answer')"><span>✗</span>No answer</button>
      <button class="r-abs" onclick="mark('absent')"><span>⌀</span>Absent</button>
    </div>
    <button class="primary" id="pickBtn" onclick="pick()" ${present ? '' : 'disabled'}>${cur ? 'Pick next student' : 'Pick a student'}</button>
    <div class="row-actions">
      <button class="link" onclick="undo()" ${state.lastEventId ? '' : 'disabled'}>Undo last mark</button>
      <button class="link" onclick="state.current=null;state.marked=false;renderCall()" ${cur ? '' : 'disabled'}>Clear screen</button>
    </div>`;
}
function subLine(s) {
  if (state.marked) {
    const last = state.events.find(e => e.id === state.lastEventId);
    if (last) return { answered: '✓ Marked answered', no_answer: '✗ Marked no answer', absent: '⌀ Marked absent' }[last.type];
  }
  const st = studentStats(s.id);
  return st.called ? `Called ${st.called}× before · ${st.answered} answered` : 'First time called';
}
function goRoster() { document.querySelector('nav button[data-view=roster]').click(); }

function choose() {
  const pool = classStudents().filter(s => !isAbsent(s.id));
  if (!pool.length) return null;
  let candidates = pool;
  if (prefs.fair) {
    const min = Math.min(...pool.map(s => callsToday(s.id)));
    candidates = pool.filter(s => callsToday(s.id) === min);
  }
  if (candidates.length > 1 && state.current) candidates = candidates.filter(s => s.id !== state.current.id);
  return candidates[Math.floor(Math.random() * candidates.length)];
}

async function pick() {
  if (state.spinning) return;
  const chosen = choose();
  if (!chosen) { toast('Everyone is marked absent'); return; }
  state.marked = false;
  const pool = classStudents().filter(s => !isAbsent(s.id));
  if (prefs.animate && pool.length > 1) {
    state.spinning = true;
    renderCall();
    $('#results').classList.add('hidden');
    $('#pickBtn').disabled = true;
    const stage = $('#stage'); stage.classList.add('spinning');
    const steps = 12;
    for (let i = 0; i < steps; i++) {
      const s = pool[Math.floor(Math.random() * pool.length)];
      $('#stagePhoto').innerHTML = photoHTML(s);
      $('#stageName').textContent = s.name;
      $('#stageSub').textContent = '';
      await new Promise(r => setTimeout(r, 45 + i * 9));
    }
    state.spinning = false;
  }
  state.current = chosen;
  renderCall();
  if (navigator.vibrate) navigator.vibrate(15);
}

async function mark(type) {
  const s = state.current;
  if (!s) return;
  const ev = { id: uid(), classId: s.classId, studentId: s.id, date: today(), ts: Date.now(), type };
  await put('events', ev);
  state.events.push(ev);
  state.lastEventId = ev.id;
  state.marked = true;
  renderCall();
  toast({ answered: `${s.name}: answered`, no_answer: `${s.name}: no answer`, absent: `${s.name}: absent today` }[type]);
}

async function undo() {
  const id = state.lastEventId;
  if (!id) return;
  await del('events', id);
  state.events = state.events.filter(e => e.id !== id);
  state.lastEventId = null;
  state.marked = false;
  renderCall();
  toast('Last mark undone');
}

/* ---------- Roster view ---------- */
function renderRoster() {
  const el = $('#view-roster');
  if (!state.classId) { el.innerHTML = noClassHTML(); return; }
  const roster = classStudents();
  const absent = roster.filter(s => isAbsent(s.id)).length;
  el.innerHTML = `
    <div class="toolbar">
      <button class="chip-btn accent" onclick="addStudentDialog()">+ Add</button>
      <button class="chip-btn" onclick="pasteNamesDialog()">Paste names</button>
      <button class="chip-btn" onclick="importPhotos()">Import photos</button>
    </div>
    ${roster.length ? `
      <div class="section-title">Today's attendance · ${roster.length - absent} present, ${absent} absent</div>
      <div class="list">${roster.map(s => {
        const abs = isAbsent(s.id), st = studentStats(s.id);
        return `<div class="item ${abs ? 'absent' : ''}">
          <button class="thumb" onclick="${s.photo ? `editStudent('${s.id}')` : `pickPhotoFor('${s.id}')`}" aria-label="Photo">${s.photo ? photoHTML(s) : '📷'}</button>
          <button class="main" style="text-align:left" onclick="editStudent('${s.id}')">
            <div class="title">${esc(s.name)}</div>
            <div class="meta">✓ ${st.answered} · ✗ ${st.noAnswer} · absent ${st.absent}</div>
          </button>
          <button class="pill ${abs ? 'absent' : 'present'}" onclick="toggleAttendance('${s.id}')">${abs ? 'Absent' : 'Present'}</button>
        </div>`;
      }).join('')}</div>
      <p class="meta" style="color:var(--muted);font-size:13px;margin:10px 4px">Tap Present/Absent to change today's attendance. Absent students are never picked. Tap 📷 to add a photo.</p>`
    : `<div class="empty"><h2>No students yet</h2><p>Add students one at a time, paste a list of names, or import a folder of photos named after each student (e.g. “Jane Doe.jpg”).</p></div>`}`;
}

async function toggleAttendance(sid) {
  const date = today();
  const existing = state.events.filter(e => e.studentId === sid && e.date === date && e.type === 'absent');
  if (existing.length) {
    await delMany('events', existing.map(e => e.id));
    state.events = state.events.filter(e => !existing.includes(e));
  } else {
    const ev = { id: uid(), classId: state.classId, studentId: sid, date, ts: Date.now(), type: 'absent' };
    await put('events', ev);
    state.events.push(ev);
  }
  if (state.current && state.current.id === sid && !existing.length) { state.current = null; state.marked = false; }
  render();
}

/* ---------- Photos ---------- */
function fileToPhoto(file, size = 480) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const w = img.naturalWidth, h = img.naturalHeight, s = Math.min(w, h);
      const sx = (w - s) / 2, sy = (h - s) * 0.3; // bias crop toward the top (faces)
      const c = document.createElement('canvas');
      c.width = c.height = Math.min(size, s);
      c.getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read image')); };
    img.src = url;
  });
}
function chooseFiles({ accept = 'image/*', multiple = false } = {}) {
  return new Promise(resolve => {
    const old = $('#filePick');
    const input = old.cloneNode(); // fresh input so the same file can be re-picked
    old.replaceWith(input);
    input.accept = accept; input.multiple = multiple;
    input.onchange = () => resolve(Array.from(input.files || []));
    input.click();
  });
}
async function pickPhotoFor(sid) {
  const [file] = await chooseFiles();
  if (!file) return;
  const s = state.students.find(x => x.id === sid);
  try { s.photo = await fileToPhoto(file); } catch { toast('Could not read that image'); return; }
  await put('students', s);
  render();
  toast('Photo saved');
}
function nameFromFile(fname) {
  let n = fname.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').replace(/\s+/g, ' ').trim();
  const m = n.match(/^([^,]+),\s*(.+)$/); // "Doe, Jane" -> "Jane Doe"
  if (m) n = m[2] + ' ' + m[1];
  return n;
}
async function importPhotos() {
  const files = await chooseFiles({ multiple: true });
  if (!files.length) return;
  toast(`Importing ${files.length} photo${files.length > 1 ? 's' : ''}…`);
  const roster = classStudents();
  const toSave = []; let added = 0, updated = 0;
  for (const f of files) {
    let photo;
    try { photo = await fileToPhoto(f); } catch { continue; }
    const name = nameFromFile(f.name);
    const existing = roster.find(s => s.name.toLowerCase() === name.toLowerCase());
    if (existing) { existing.photo = photo; toSave.push(existing); updated++; }
    else {
      const s = { id: uid(), classId: state.classId, name, photo, created: Date.now() };
      state.students.push(s); toSave.push(s); added++;
    }
  }
  await putMany('students', toSave);
  render();
  toast(`${added} added, ${updated} photos updated`);
}

async function saveNewStudent() {

function pasteNamesDialog() {
  openDialog(`<h3>Paste names</h3>
    <p>One student per line. You can copy a column from a spreadsheet or your LMS roster. “Last, First” is converted to “First Last”.</p>
    <textarea id="namesBox" placeholder="Jane Doe&#10;John Smith&#10;…"></textarea>
    <div class="btns"><button class="btn" onclick="closeDialog()">Cancel</button><button class="btn accent" onclick="saveNames()">Add students</button></div>`);
}
async function saveNames() {
  const existing = new Set(classStudents().map(s => s.name.toLowerCase()));
  const names = $('#namesBox').value.split(/\r?\n/).map(l => l.split('\t')[0].trim()).filter(Boolean)
    .map(n => { const m = n.match(/^([^,]+),\s*(.+)$/); return m ? m[2] + ' ' + m[1] : n; })
    .filter(n => !existing.has(n.toLowerCase()) && (existing.add(n.toLowerCase()), true));
  const list = names.map(name => ({ id: uid(), classId: state.classId, name, photo: null, created: Date.now() }));
  await putMany('students', list);
  state.students.push(...list);

  toast(`Added ${list.length} student${list.length === 1 ? '' : 's'}`);

function editStudent(sid) {
  const s = state.students.find(x => x.id === sid);
  const st = studentStats(sid);
  const pct = st.called ? Math.round(100 * st.answered / st.called) + '% answered' : 'not called yet';
  openDialog(`<h3>Student</h3>
    <button class="big-photo" onclick="changePhoto('${sid}')">${s.photo ? photoHTML(s) : '📷'}</button>
    <p style="text-align:center">Tap photo to change</p>
    <input type="text" id="editName" value="${esc(s.name)}" autocomplete="off">
    <div class="stats-line">Called ${st.called}× · ✓ ${st.answered} · ✗ ${st.noAnswer} · absent ${st.absent} · ${pct}</div>
    <div class="btns">
      <button class="btn danger" onclick="deleteStudent('${sid}')" style="margin-right:auto">Delete</button>
      <button class="btn" onclick="closeDialog()">Cancel</button>
      <button class="btn accent" onclick="saveStudent('${sid}')">Save</button>
    </div>`);
}
async function changePhoto(sid) {
  const [file] = await chooseFiles();
  if (!file) return;
  const s = state.students.find(x => x.id === sid);
  try { s.photo = await fileToPhoto(file); } catch { toast('Could not read that image'); return; }
  await put('students', s);
  editStudent(sid); render();
}
async function saveStudent(sid) {
  const s = state.students.find(x => x.id === sid);
  const name = $('#editName').value.trim();
  if (name) { s.name = name; await put('students', s); }
  closeDialog(); render();
}
async function deleteStudent(sid) {
  const s = state.students.find(x => x.id === sid);
  if (!confirm(`Delete ${s.name} and their call history?`)) return;
  const evIds = state.events.filter(e => e.studentId === sid).map(e => e.id);
  await delMany('events', evIds);
  await del('students', sid);
  state.events = state.events.filter(e => e.studentId !== sid);
  state.students = state.students.filter(x => x.id !== sid);
  if (state.current && state.current.id === sid) state.current = null;
  closeDialog(); render();
}

/* ---------- History view ---------- */
function renderHistory() {
  const el = $('#view-history');
  if (!state.classId) { el.innerHTML = noClassHTML(); return; }
  const ev = classEvents();
  const dates = [...new Set(ev.map(e => e.date))].sort().reverse();
  if (!dates.includes(today())) dates.unshift(today());
  const date = state.historyDate && dates.includes(state.historyDate) ? state.historyDate : dates[0];
  const dayEv = ev.filter(e => e.date === date).sort((a, b) => b.ts - a.ts);
  const byId = Object.fromEntries(state.students.map(s => [s.id, s]));
  const count = t => dayEv.filter(e => e.type === t).length;
  const label = d => new Date(d + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) + (d === today() ? ' (today)' : '');
  el.innerHTML = `
    <div class="toolbar">
      <select class="chip-btn" style="flex:1" onchange="state.historyDate=this.value;renderHistory()">
        ${dates.map(d => `<option value="${d}" ${d === date ? 'selected' : ''}>${label(d)}</option>`).join('')}
      </select>
      <button class="chip-btn" onclick="exportDialog()">Export</button>
    </div>
    <div class="summary">
      <div><b style="color:var(--ok)">${count('answered')}</b><small>Answered</small></div>
      <div><b style="color:var(--warn)">${count('no_answer')}</b><small>No answer</small></div>
      <div><b>${count('absent')}</b><small>Absent</small></div>
    </div>
    ${dayEv.length ? `<div class="list">${dayEv.map(e => {
      const s = byId[e.studentId];
      const t = new Date(e.ts).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
      return `<div class="item">
        <div class="thumb">${photoHTML(s)}</div>
        <div class="main"><div class="title">${esc(s ? s.name : 'Deleted student')}</div><div class="meta">${t}</div></div>
        <span class="tag ${e.type}">${{ answered: 'Answered', no_answer: 'No answer', absent: 'Absent' }[e.type]}</span>
        <button class="x" onclick="deleteEvent('${e.id}')" aria-label="Delete">×</button>
      </div>`;
    }).join('')}</div>` : `<div class="empty"><p>Nothing recorded on this day.</p></div>`}`;
}
async function deleteEvent(id) {
  await del('events', id);
  state.events = state.events.filter(e => e.id !== id);
  if (state.lastEventId === id) state.lastEventId = null;
  renderHistory();
}

/* ---------- Export / backup ---------- */
async function shareFile(filename, text, type) {
  const blob = new Blob([text], { type });
  const file = new File([blob], filename, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: filename }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const csvCell = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
const csv = rows => rows.map(r => r.map(csvCell).join(',')).join('\n');
const className = () => (state.classes.find(c => c.id === state.classId) || {}).name || 'class';
const safe = s => s.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_');

function exportDialog() {
  openDialog(`<h3>Export</h3>
    <div class="menu-list">
      <button onclick="exportLog()">Call log (CSV)<small>Every mark with date and time</small></button>
      <button onclick="exportSummary()">Student summary (CSV)<small>Totals per student: called, answered, no answer, absences</small></button>
      <button onclick="exportAttendance()">Attendance by date (CSV)<small>One row per student, one column per class day</small></button>
    </div>
    <div class="btns"><button class="btn" onclick="closeDialog()">Close</button></div>`);
}
function exportLog() {
  const byId = Object.fromEntries(state.students.map(s => [s.id, s]));
  const rows = [['Date', 'Time', 'Student', 'Result']];
  classEvents().sort((a, b) => a.ts - b.ts).forEach(e => rows.push([
    e.date, new Date(e.ts).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }),
    byId[e.studentId] ? byId[e.studentId].name : 'Deleted student',
    { answered: 'Answered', no_answer: 'No answer', absent: 'Absent' }[e.type]]));
  shareFile(`${safe(className())}_call_log.csv`, csv(rows), 'text/csv');
}
function exportSummary() {
  const rows = [['Student', 'Times called', 'Answered', 'No answer', 'Absences', '% answered']];
  classStudents().forEach(s => {
    const st = studentStats(s.id);
    rows.push([s.name, st.called, st.answered, st.noAnswer, st.absent, st.called ? Math.round(100 * st.answered / st.called) : '']);
  });
  shareFile(`${safe(className())}_summary.csv`, csv(rows), 'text/csv');
}
function exportAttendance() {
  const dates = [...new Set(classEvents().map(e => e.date))].sort();
  const rows = [['Student', ...dates]];
  classStudents().forEach(s => rows.push([s.name, ...dates.map(d => isAbsent(s.id, d) ? 'Absent' : 'Present')]));
  shareFile(`${safe(className())}_attendance.csv`, csv(rows), 'text/csv');
}
async function backup() {
  const data = { app: 'RosterCaller', version: 1, exported: new Date().toISOString(), classes: state.classes, students: state.students, events: state.events };
  await shareFile(`RosterCaller_backup_${today()}.json`, JSON.stringify(data), 'application/json');
}
async function restore() {
  const [file] = await chooseFiles({ accept: '.json,application/json' });
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch { toast('That file is not a valid backup'); return; }
  if (data.app !== 'RosterCaller' || !Array.isArray(data.students)) { toast('That file is not a Roster Caller backup'); return; }
  if (!confirm(`Restore ${data.classes.length} class(es) and ${data.students.length} student(s)? Matching items on this phone will be overwritten; nothing else is removed.`)) return;
  await putMany('classes', data.classes);
  await putMany('students', data.students);
  await putMany('events', data.events || []);
  await loadAll();
  if (!state.classes.find(c => c.id === state.classId)) state.classId = state.classes[0] ? state.classes[0].id : null;
  closeDialog(); renderAll();
  toast('Backup restored');
}

/* ---------- Settings ---------- */
function settingsDialog() {
  const c = state.classes.find(x => x.id === state.classId);
  openDialog(`<h3>Settings</h3>
    <label class="toggle"><span>Fair rotation<small>Call everyone once before anyone is called again (per day)</small></span>
      <input type="checkbox" ${prefs.fair ? 'checked' : ''} onchange="prefs.fair=this.checked;savePref('prefs',prefs)"></label>
    <label class="toggle"><span>Shuffle animation<small>Briefly flip through faces before landing on a student</small></span>
      <input type="checkbox" ${prefs.animate ? 'checked' : ''} onchange="prefs.animate=this.checked;savePref('prefs',prefs)"></label>
    <div class="menu-list">
      ${c ? `<button onclick="renameClassDialog()">Rename “${esc(c.name)}”</button>` : ''}
      <button onclick="newClassDialog()">New class</button>
      <button onclick="backup()">Back up all data<small>Save a file (with photos) to Files, iCloud Drive, or AirDrop</small></button>
      <button onclick="restore()">Restore from backup</button>
      ${c ? `<button onclick="deleteClass()" style="color:#dc2626">Delete this class</button>` : ''}
    </div>
    <p>All rosters, photos and records are stored only on this device. Nothing is uploaded.</p>
    <div class="btns"><button class="btn" onclick="closeDialog()">Close</button></div>`);
}
$('#settingsBtn').addEventListener('click', settingsDialog);
function renameClassDialog() {
  const c = state.classes.find(x => x.id === state.classId);
  openDialog(`<h3>Rename class</h3>
    <input type="text" id="renameBox" value="${esc(c.name)}" autocomplete="off">
    <div class="btns"><button class="btn" onclick="closeDialog()">Cancel</button><button class="btn accent" onclick="renameClass()">Save</button></div>`);
}
async function renameClass() {
  const c = state.classes.find(x => x.id === state.classId);
  const name = $('#renameBox').value.trim();
  if (name) { c.name = name; await put('classes', c); }
  closeDialog(); renderAll();
}
async function deleteClass() {
  const c = state.classes.find(x => x.id === state.classId);
  if (!confirm(`Delete “${c.name}”, all its students, photos and history? This cannot be undone.`)) return;
  const sIds = state.students.filter(s => s.classId === c.id).map(s => s.id);
  const eIds = state.events.filter(e => e.classId === c.id).map(e => e.id);
  await delMany('events', eIds); await delMany('students', sIds); await del('classes', c.id);
  await loadAll();
  closeDialog();
  selectClass(state.classes[0] ? state.classes[0].id : null);
}

/* ---------- Boot ---------- */
const isStandalone = () => window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
async function loadAll() {
  [state.classes, state.students, state.events] = await Promise.all([getAll('classes'), getAll('students'), getAll('events')]);
}
(async function init() {
  db = await openDB();
  await loadAll();
  const saved = loadPref('classId');
  state.classId = state.classes.find(c => c.id === saved) ? saved : (state.classes[0] ? state.classes[0].id : null);
  renderAll();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
// Re-render when the app comes back to the foreground on a new day
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
</script>
